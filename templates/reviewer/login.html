{% extends "reviewer/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button class="btn" type="submit" style="margin-top:18px;width:100%;">Login</button>
  </form>
  <p style="margin-top:14px;font-size:0.9rem;">No account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
